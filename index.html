<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>GameBox</title>
  <style>
    body { margin:0; background:#111; color:#fff; font-family:Arial,sans-serif; text-align:center; }
    h1 { padding:20px; color:#0ff; }
    .games { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:20px; }
    .card { background:#222; border:1px solid #333; border-radius:8px; padding:10px; }
    canvas { display:block; background:#000; }
    p { margin:6px 0; font-size:13px; color:#aaa; }
  </style>
</head>
<body>
<h1>🎮 GameBox</h1>
<div class="games">

  <div class="card">
    <canvas id="snake" width="300" height="250"></canvas>
    <p><b>Snake</b> — setas para mover, SPACE reinicia</p>
  </div>

  <div class="card">
    <canvas id="pong" width="300" height="250"></canvas>
    <p><b>Pong</b> — W/S você, ↑/↓ CPU</p>
  </div>

  <div class="card">
    <canvas id="break" width="300" height="250"></canvas>
    <p><b>Breakout</b> — mouse para mover, SPACE reinicia</p>
  </div>

</div>
<script>
/* SNAKE */
(function(){
  const c=document.getElementById('snake'),ctx=c.getContext('2d');
  const G=20,COLS=15,ROWS=12;
  let snake,dir,food,score,alive,loop;
  function init(){
    snake=[{x:5,y:5}];dir={x:1,y:0};score=0;alive=true;
    food={x:10,y:6};clearInterval(loop);loop=setInterval(tick,150);
  }
  function tick(){
    if(!alive)return;
    const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS||snake.some(s=>s.x===h.x&&s.y===h.y)){alive=false;draw();return;}
    snake.unshift(h);
    if(h.x===food.x&&h.y===food.y){score++;food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
    else snake.pop();
    draw();
  }
  function draw(){
    ctx.fillStyle='#000';ctx.fillRect(0,0,300,250);
    ctx.fillStyle='#f00';ctx.fillRect(food.x*G+2,food.y*G+2,G-4,G-4);
    snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#fff':'#0f0';ctx.fillRect(s.x*G+1,s.y*G+1,G-2,G-2);});
    ctx.fillStyle='#0f0';ctx.font='12px Arial';ctx.fillText('Score: '+score,6,14);
    if(!alive){
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,300,250);
      ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
      ctx.fillText('Game Over',150,115);ctx.font='12px Arial';ctx.fillText('SPACE para reiniciar',150,140);ctx.textAlign='left';
    }
  }
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'&&dir.y===0)dir={x:0,y:-1};
    if(e.key==='ArrowDown'&&dir.y===0)dir={x:0,y:1};
    if(e.key==='ArrowLeft'&&dir.x===0)dir={x:-1,y:0};
    if(e.key==='ArrowRight'&&dir.x===0)dir={x:1,y:0};
    if(e.key===' '&&!alive)init();
  });
  init();
})();

/* PONG */
(function(){
  const c=document.getElementById('pong'),ctx=c.getContext('2d');
  const W=300,H=250;
  let py=H/2-30,cy=H/2-30,bx=W/2,by=H/2,bvx=3,bvy=3,ps=0,cs=0;
  const keys={};
  document.addEventListener('keydown',e=>keys[e.key]=true);
  document.addEventListener('keyup',e=>keys[e.key]=false);
  function tick(){
    if(keys['w'])py=Math.max(0,py-5);
    if(keys['s'])py=Math.min(H-60,py+5);
    const m=cy+30;
    if(m<by)cy=Math.min(H-60,cy+3);
    if(m>by)cy=Math.max(0,cy-3);
    bx+=bvx;by+=bvy;
    if(by<6||by>H-6)bvy=-bvy;
    if(bx<20&&by>=py&&by<=py+60)bvx=Math.abs(bvx);
    if(bx>W-20&&by>=cy&&by<=cy+60)bvx=-Math.abs(bvx);
    if(bx<0){cs++;reset();}
    if(bx>W){ps++;reset();}
    draw();requestAnimationFrame(tick);
  }
  function reset(){bx=W/2;by=H/2;bvx=(Math.random()>.5?1:-1)*3;bvy=(Math.random()>.5?1:-1)*3;}
  function draw(){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    ctx.setLineDash([6,6]);ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#fff';
    ctx.fillRect(12,py,8,60);ctx.fillRect(W-20,cy,8,60);
    ctx.beginPath();ctx.arc(bx,by,6,0,Math.PI*2);ctx.fill();
    ctx.font='16px Arial';ctx.textAlign='center';ctx.fillText(ps+' : '+cs,W/2,20);
  }
  tick();
})();

/* BREAKOUT */
(function(){
  const c=document.getElementById('break'),ctx=c.getContext('2d');
  const W=300,H=250,BW=30,BH=12,COLS=8,ROWS=4;
  const COLORS=['#f00','#f80','#ff0','#0f0'];
  let bricks,px,bx,by,bvx,bvy,score,alive;
  function init(){
    px=W/2-30;bx=W/2;by=H-40;bvx=3;bvy=-3;score=0;alive=true;
    bricks=[];
    for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++)
      bricks.push({x:5+col*(BW+3),y:20+r*(BH+5),on:true,color:COLORS[r]});
  }
  c.addEventListener('mousemove',e=>{
    const r=c.getBoundingClientRect();
    px=(e.clientX-r.left)*(W/r.width)-30;
    px=Math.max(0,Math.min(W-60,px));
  });
  document.addEventListener('keydown',e=>{if(e.key===' '&&!alive)init();});
  function tick(){
    if(alive){
      bx+=bvx;by+=bvy;
      if(bx<6||bx>W-6)bvx=-bvx;
      if(by<6)bvy=-bvy;
      if(by>H-20&&by<H&&bx>=px&&bx<=px+60)bvy=-Math.abs(bvy);
      if(by>H)alive=false;
      bricks.forEach(b=>{
        if(!b.on)return;
        if(bx>b.x&&bx<b.x+BW&&by>b.y&&by<b.y+BH){b.on=false;bvy=-bvy;score++;}
      });
      if(bricks.every(b=>!b.on))init();
    }
    draw();requestAnimationFrame(tick);
  }
  function draw(){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    bricks.forEach(b=>{if(!b.on)return;ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,BW,BH);});
    ctx.fillStyle='#0ff';ctx.beginPath();ctx.arc(bx,by,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(px,H-15,60,8);
    ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='left';ctx.fillText('Score: '+score,5,14);
    if(!alive){
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
      ctx.fillText('Game Over',W/2,115);ctx.font='12px Arial';ctx.fillText('SPACE para reiniciar',W/2,140);
    }
  }
  init();tick();
})();
</script>
</body>
</html>
